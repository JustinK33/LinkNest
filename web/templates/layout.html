{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="LinkNest">
  <meta name="theme-color" content="#56738c">
  <title>{{block "title" .}}LinkNest - Your Links, Your Way{{end}}</title>
  {{block "meta" .}}
  <meta name="description" content="One tappable page for every link that matters. Share your profile, portfolio and socials from a single LinkNest address.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LinkNest">
  <meta property="og:title" content="LinkNest - Your Links, Your Way">
  <meta property="og:description" content="One tappable page for every link that matters.">
  <meta property="og:url" content="{{.SiteURL}}/">
  <meta property="og:image" content="{{.SiteURL}}/static/linknestlogo.png">
  <meta name="twitter:card" content="summary">
  {{end}}
  <link rel="icon" href="/static/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="navbar-brand">
        <span class="navbar-brand-mark"><img src="/static/icon-64.png" alt="LinkNest logo" width="64" height="64" class="brand-logo-image"></span>
        <span class="navbar-brand-text">LinkNest</span>
      </a>
      <div class="navbar-links">
        {{if .CurrentUser.ID}}
          <a href="/dashboard">Dashboard</a>
          <a href="/{{.CurrentUser.Slug}}">Profile</a>
          <form method="post" action="/logout" style="display:inline"><button type="submit" class="btn btn-sm btn-secondary">Log out</button></form>
        {{else}}
          <a href="/login" class="btn btn-sm btn-secondary">Sign in</a>
          <a href="/register" class="btn btn-sm btn-primary">Register</a>
        {{end}}
      </div>
    </div>
  </nav>

  {{with .Flash}}
    <div class="flash-container">
      <div class="flash {{.Kind}}" role="status">{{.Message}}</div>
    </div>
  {{end}}

  <main>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
