{{define "title"}}Sign in - LinkNest{{end}}
{{define "content"}}
<div class="container-sm auth-shell">
  <div class="form-container">
    <div class="form-header">
      <h1>Welcome back</h1>
      <p>Sign in to manage your links</p>
    </div>

    {{if .Data.Error}}
      <div class="error-messages">
        <ul><li>{{.Data.Error}}</li></ul>
      </div>
    {{end}}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username" placeholder="Enter your email address">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password" maxlength="72">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
    </form>

    <p class="auth-footer auth-footer-muted">
      Don't have an account?
      <a href="/register">Create one</a>
    </p>
  </div>
</div>
{{end}}
