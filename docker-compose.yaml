services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-linknest}
      MYSQL_USER: ${MYSQL_USER:-linknest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-linknest}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    image: linknest-go:latest
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      DATABASE_URL: ${GO_DATABASE_URL:-mysql://linknest:linknest@mysql:3306/linknest}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
    ports:
      - "${HOST_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
