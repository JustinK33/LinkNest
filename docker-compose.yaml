services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linknest}
      POSTGRES_USER: ${POSTGRES_USER:-linknest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linknest}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    image: linknest-go:latest
    env_file:
      - .env
    environment:
      ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://linknest:linknest@postgres:5432/linknest?sslmode=disable}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
